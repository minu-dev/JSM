  html{background:#EDE7DA}

    overflow-x:hidden;
  }
  body.locked{overflow:hidden}
  #grain{
    position:fixed;inset:0;z-index:40;pointer-events:none;

  }
  .page{max-width:560px;margin:0 auto;padding:0 18px}
  a{color:#6b6270}
  a:hover{color:#3f3a34}

  /* ---- cover ---- */
  .cover{padding:24vh 0 20vh;text-align:center}
  .cover h1{
    font-family:'Geumeunbohwa',cursive;
    font-size:52px;font-weight:400;margin:0;line-height:1.15;
    letter-spacing:.02em;color:#4c3f63;
  }
  .cover .rule{width:38px;height:1px;background:#cfc7b8;margin:26px auto}
  .cover .date{font-size:20px;letter-spacing:.06em;color:#9c9488}

  /* ---- spreads ---- */
  .spread{position:relative;margin:0 0 13vh}
  .spread .ttl{
    position:absolute;left:2%;top:-2.5em;
    font-family:'Geumeunbohwa',cursive;font-size:30px;line-height:1.15;
    color:#4c3f63;max-width:90%;
  }
  .ph{position:absolute;margin:0;transform:rotate(var(--rot))}

  /* polaroid */
  .frm{
    position:relative;
    background:linear-gradient(#fff,#fdfcfa);
    padding:9px 9px 0;
    box-shadow:0 8px 22px rgba(70,58,44,.13), 0 1px 3px rgba(70,58,44,.10);
    cursor:pointer;
  }
  .im{position:relative;aspect-ratio:var(--ar);overflow:hidden;background:#e6e1d7}
  .im img,.im video{display:block;width:100%;height:100%;object-fit:cover;background:#e6e1d7}
  .im.miss{background:repeating-linear-gradient(45deg,#eae5db 0 6px,#e2dcd1 6px 12px)}
  .im.miss::after{
    content:attr(data-note);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:10px/1.4 ui-monospace,monospace;color:#a79e92;text-align:center;padding:8px;
  }
  .cap{
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:'Geumeunbohwa',cursive;font-size:13.5px;line-height:1.25;
    color:#5c4a7d;padding:7px 6px 8px;min-height:34px;word-break:keep-all;
  }
  .cap.blank{min-height:26px;padding:0}

  /* washi tape */
  .tape{
    position:absolute;z-index:3;pointer-events:none;
    width:46px;height:19px;opacity:.82;
    box-shadow:0 1px 2px rgba(70,58,44,.13);
  }
  .tape::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(255,255,255,.34),rgba(255,255,255,0) 30%,rgba(255,255,255,.28));
  }
  .t-stripe{background:repeating-linear-gradient(48deg,#bcd8cf 0 5px,#eef6f2 5px 10px)}
  .t-dot{background:#e6dcc6;background-image:radial-gradient(#c9b998 1.6px,transparent 1.7px);background-size:9px 9px}
  .t-plain{background:#d9d3e2}
  .t-check{background:repeating-linear-gradient(0deg,#e7d5d2 0 5px,#f6ecea 5px 10px),repeating-linear-gradient(90deg,#e7d5d2 0 5px,#f6ecea 5px 10px);background-blend-mode:multiply}
  .t-kraft{background:repeating-linear-gradient(90deg,#e3d6bd 0 4px,#efe6d3 4px 9px)}

  /* ---- video ---- */
  .play{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
    width:54px;height:54px;border-radius:50%;border:0;padding:0;
    background:rgba(255,255,255,.76);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;
    transition:opacity .28s ease-out;cursor:pointer;
  }
  .play::before{
    content:"";display:block;
    border-left:14px solid rgba(60,50,44,.7);
    border-top:9px solid transparent;border-bottom:9px solid transparent;
    margin-left:4px;
  }
  .vid.playing .play{opacity:0;pointer-events:none}

  /* ---- letter ---- */
  .letter{background:#EBE4D5;border-top:1px solid #ded7c7;margin-top:4vh;padding:14vh 0 16vh}
  .letter .inner{max-width:560px;margin:0 auto;padding:0 30px}
  .letter h2{font-family:'Geumeunbohwa',cursive;font-weight:400;font-size:28px;margin:0 0 1.4em;color:#4c3f63}
  .letter p{font-family:'Geumeunbohwa',cursive;font-size:21px;line-height:1.9;color:#514a54;margin:0;white-space:pre-line}
  .letter .sign{margin-top:3em;text-align:right;font-family:'Geumeunbohwa',cursive;font-size:20px;color:#8d8479}

  /* ---- lightbox ---- */
  #lb{position:fixed;inset:0;z-index:60;visibility:hidden}
  #lb.on{visibility:visible}
  #lbbg{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .3s ease-out}
  #lb.on #lbbg{opacity:.85}
  #lbimg{
    position:fixed;transform-origin:50% 50%;
    border:6px solid #fff;object-fit:cover;
    transition:transform .3s ease-out;will-change:transform;
  }
  #lbcap{
    position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));
    text-align:center;font-family:'Geumeunbohwa',cursive;font-size:17px;color:rgba(255,255,255,.82);
    padding:0 28px;opacity:0;transition:opacity .3s ease-out .06s;
  }
  #lb.on #lbcap{opacity:1}
  #lbx{
    position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));
    width:44px;height:44px;background:none;border:0;padding:0;cursor:pointer;

  }
  #lb.on #lbx{opacity:.85}
  #lbx::before,#lbx::after{content:"";position:absolute;left:12px;top:21px;width:20px;height:1px;background:#fff}
  #lbx::before{transform:rotate(45deg)}
  #lbx::after{transform:rotate(-45deg)}
  @media (prefers-reduced-motion:reduce){

  }

const TAPES=['t-stripe','t-dot','t-plain','t-check','t-kraft'];

function rnd(i,salt){
  const s=Math.sin((i+1)*12.9898+salt*78.233)*43758.5453;
  return s-Math.floor(s);
}
function tilt(i){ return (rnd(i,0)*4-2).toFixed(2); }

function ratio(slots){
  let m=0;
  for(const s of slots) m=Math.max(m,(s.w/100)/(s.ar*(1-s.t/100)));
  return m+0.3;
}
function chunks(n, gidArr){
  if(n<=7) return [n];
  const cyc=[6,5,7,5,6,4], out=[]; let rem=n,i=0,pos=0;
  while(rem>0){
    let t=Math.min(cyc[i%cyc.length],rem);
    if(rem-t>0 && rem-t<3) t=rem;
    // never cut in the middle of a same-comment group
    let cut=pos+t;
    if(gidArr && cut<n && gidArr[cut-1]===gidArr[cut]){
      let fwd=cut, back=cut;
      while(fwd<n && gidArr[fwd-1]===gidArr[fwd]) fwd++;
      while(back>pos+1 && gidArr[back-1]===gidArr[back]) back--;
      cut = (fwd-cut <= cut-back) ? fwd : back;
      t = cut-pos;
    }
    out.push(t); pos+=t; rem=n-pos; i++;
  }
  return out;
}

const album=document.getElementById('album');
const vcount={};
let gi=0;

MANIFEST.forEach((ch,ci)=>{
  const items=ch.items;
  const gidMap=new Map(); let gnext=0;
  const gid = items.map(it=>{
    if(!it.comment) return 'x'+(gnext++);
    if(!gidMap.has(it.comment)) gidMap.set(it.comment, gnext++);
    return gidMap.get(it.comment);
  });
  const lastIdxOfGid = new Map();
  gid.forEach((g,i)=> lastIdxOfGid.set(g,i));
  let cursor=0;
  chunks(items.length, items.map((it,i)=> it.comment ? gid[i] : Symbol())).forEach((size,part)=>{
    const part_items=items.slice(cursor,cursor+size);
    const variants=T[size]||T[7];
    const k=vcount[size]=((vcount[size]||0)+1);
    const slots=variants[(k-1)%variants.length];

    const sp=document.createElement('section');
    sp.className='spread';
    sp.style.aspectRatio='1 / '+ratio(slots).toFixed(3);
    sp.style.marginTop=(part?'9vh':'15vh');

    if(!part){
      const t=document.createElement('div');
      t.className='ttl';
      t.textContent=ch.title;
      sp.appendChild(t);
    }

    part_items.forEach((it,j)=>{
      const s=slots[j%slots.length];
      const fig=document.createElement('figure');
      fig.className='ph'+(it.type==='video'?' vid':'');
      fig.style.left=s.l+'%'; fig.style.width=s.w+'%';
      fig.dataset.t=s.t;
      fig.style.setProperty('--rot',tilt(gi)+'deg');

      const frm=document.createElement('div'); frm.className='frm';
      const im=document.createElement('div'); im.className='im'; im.style.setProperty('--ar',s.ar);
      const name=it.src.split('/').pop();

      if(it.type==='video'){
        const v=document.createElement('video');
        v.preload='metadata'; v.playsInline=true; v.muted=true; v.loop=true;
        if(it.poster) v.poster=encodeURI('./web/'+it.poster);
        const src=document.createElement('source');
        src.src=encodeURI('./web/'+it.src); src.type='video/mp4';
        v.appendChild(src);
        v.addEventListener('error',()=>{
          const u=encodeURI('./web/'+it.src.normalize('NFC'));
          if(src.src.indexOf(u)<0){ src.src=u; v.load(); }
        },true);
        im.appendChild(v);
        const b=document.createElement('button'); b.className='play'; b.setAttribute('aria-label','재생');
        im.appendChild(b);
      }else{
        const img=document.createElement('img');
        img.src=encodeURI('./web/'+it.src);
        img.alt=it.comment||ch.title;
        img.decoding='async';
        img.dataset.alt=encodeURI('./web/'+it.src.normalize('NFC'));
        img.addEventListener('error',()=>{
          if(img.dataset.alt && img.src.indexOf(img.dataset.alt)<0){ const u=img.dataset.alt; img.dataset.alt=''; img.src=u; return; }
          im.classList.add('miss'); im.dataset.note=name; img.remove();
        });
        im.appendChild(img);
      }
      frm.appendChild(im);

      const gIdx=cursor+j;
      fig.dataset.grp=gid[gIdx];
      fig.dataset.cap=it.comment||'';
      const lastOfGroupHere = lastIdxOfGid.get(gid[gIdx]) === gIdx;
      const cap=document.createElement('figcaption');
      const text=(it.comment && lastOfGroupHere) ? it.comment : '';
      cap.className='cap'+(text?'':' blank');
      cap.textContent=text;
      frm.appendChild(cap);

      /* washi tape, index-fixed side + look */
      const tp=document.createElement('span');
      tp.className='tape '+TAPES[Math.floor(rnd(gi,3)*TAPES.length)];
      const side=Math.floor(rnd(gi,5)*4);
      const jx=8+rnd(gi,7)*22, rot=(rnd(gi,9)*70-35).toFixed(1);
      const tw=(38+rnd(gi,11)*22);
      tp.style.width=tw+'px';
      if(side===0){ tp.style.left=jx+'%'; tp.style.top='-9px'; }
      else if(side===1){ tp.style.right=jx+'%'; tp.style.top='-9px'; }
      else if(side===2){ tp.style.left='-14px'; tp.style.top=(14+rnd(gi,13)*16)+'%'; }
      else { tp.style.right='-14px'; tp.style.top=(14+rnd(gi,13)*16)+'%'; }
      tp.style.transform='rotate('+rot+'deg)';
      frm.appendChild(tp);

      fig.appendChild(frm);
      sp.appendChild(fig);
      gi++;
    });
    album.appendChild(sp);
    cursor+=size;
  });
});

/* size each spread to its actual polaroid stack (frames are taller than the photo) */
function fitSpreads(){
  document.querySelectorAll('.spread').forEach(sp=>{
    sp.style.height='auto';
    sp.style.aspectRatio='auto';
    const w=sp.getBoundingClientRect().width;
    let deep=0;
    sp.querySelectorAll('.ph').forEach(f=>{
      const top=Math.round(parseFloat(f.dataset.t)/100*w);
      f.style.top=top+'px';
      deep=Math.max(deep, top+f.querySelector('.frm').offsetHeight);
    });
    /* nobody may cover anybody's caption strip */
    const F=[...sp.querySelectorAll('.ph')].map(f=>{
      const frm=f.querySelector('.frm'), cap=f.querySelector('.cap');
      return {f,frm,x:f.offsetLeft,w:f.offsetWidth,h:frm.offsetHeight,
              top:parseFloat(f.style.top),capH:cap?cap.offsetHeight:0,
              grp:f.dataset.grp,
              hasCap:cap&&!cap.classList.contains('blank')};
    });
    function avoidCollisions(){
      for(let pass=0;pass<4;pass++){
        let moved=false;
        for(let i=1;i<F.length;i++){
          for(let j=0;j<i;j++){
            const a=F[i], b=F[j];
            if(!b.hasCap || a.grp===b.grp) continue;
            if(Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x) <= 4) continue;
            const bandTop=b.top+b.h-b.capH-4, bandBot=b.top+b.h+4;
            if(a.top+a.h > bandTop && a.top < bandBot){
              a.top=Math.round(bandBot+8); moved=true;
            }
          }
        }
        if(!moved) break;
      }
    }
    avoidCollisions();
    for(let i=1;i<F.length;i++){
      const a=F[i], b=F[i-1];
      if(a.grp!==b.grp) continue;
      a.top=Math.round(b.top+b.h*0.46);
      const dx0=Math.round(((b.x+b.w*0.5)-(a.x+a.w*0.5))*0.35);
      a.f.style.marginLeft=dx0+'px';
      a.x+=dx0;
      // if piling now covers someone else's caption band, try sliding sideways to clear it before giving up and pushing down
      const blockers = F.filter(o=>o!==a && o.hasCap && o.grp!==a.grp)
                       .filter(o=>{ const bandTop=o.top+o.h-o.capH-4, bandBot=o.top+o.h+4; return a.top+a.h>bandTop && a.top<bandBot; });
      if(blockers.length){
        const minX=0, maxX=w-a.w;
        let best=null;
        for(let dx=0; dx<=w && best===null; dx+=8){
          for(const cand of [a.x+dx, a.x-dx]){
            if(cand<minX||cand>maxX) continue;
            const clear = blockers.every(bx=> Math.min(cand+a.w,bx.x+bx.w)-Math.max(cand,bx.x) <= 4);
            if(clear){ best=cand; break; }
          }
        }
        if(best!==null){
          const shift=Math.round(best-a.x);
          a.f.style.marginLeft=(parseFloat(a.f.style.marginLeft||'0')+shift)+'px';
          a.x=best;
        }
      }
    }
    avoidCollisions();
    deep=0;
    F.forEach(o=>{ o.f.style.top=o.top+'px'; deep=Math.max(deep,o.top+o.h); });
    sp.style.height=Math.ceil(deep+10)+'px';
  });
}
function fitAll(){ fitSpreads(); }
addEventListener('load',fitAll);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll);
requestAnimationFrame(fitAll);
if(window.ResizeObserver){
  let pend=null;
  const ro=new ResizeObserver(()=>{ clearTimeout(pend); pend=setTimeout(fitAll,80); });

}

/* ---------- lightbox ---------- */
const lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg'),
      lbcap=document.getElementById('lbcap'), lbbg=document.getElementById('lbbg');
let state=null;

function target(r){
  const sc=Math.min(innerWidth*0.9/r.width, innerHeight*0.8/r.height);
  return {sc, dx:innerWidth/2-(r.left+r.width/2), dy:innerHeight/2-(r.top+r.height/2)};
}
function apply(extra){
  const t=state.t;
  lbimg.style.transform='translate('+t.dx+'px,'+(t.dy+(extra||0))+'px) scale('+t.sc+') rotate(0deg)';
}
function open(fig){
  const img=fig.querySelector('img'); if(!img) return;
  const r=fig.querySelector('.im').getBoundingClientRect();
  const rot=fig.style.getPropertyValue('--rot');
  const capText=fig.dataset.cap||'';
  lbimg.src=img.currentSrc||img.src;
  lbcap.textContent=capText;
  lbimg.style.transition='none';
  lbimg.style.left=r.left+'px'; lbimg.style.top=r.top+'px';
  lbimg.style.width=r.width+'px'; lbimg.style.height=r.height+'px';
  lbimg.style.transform='rotate('+rot+')';
  const t=target(r);
  lbimg.style.borderWidth=(6/t.sc)+'px';
  state={rot,t,drag:0};
  lb.classList.add('on'); lb.setAttribute('aria-hidden','false');
  document.body.classList.add('locked');
  requestAnimationFrame(()=>{ lbimg.style.transition='transform .3s ease-out'; apply(0); });
}
function close(){
  if(!state) return;
  lbimg.style.transition='transform .3s ease-out';
  lbimg.style.transform='rotate('+state.rot+')';
  lb.classList.remove('on'); lb.setAttribute('aria-hidden','true');
  document.body.classList.remove('locked');
  state=null;
  setTimeout(()=>{ if(!state) lbimg.removeAttribute('src'); },320);
}
album.addEventListener('click',e=>{
  const fig=e.target.closest('.ph');
  if(!fig || fig.classList.contains('vid')) return;
  open(fig);
});
document.getElementById('lbx').addEventListener('click',close);
lbbg.addEventListener('click',close);
addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });

let sy=null;
lb.addEventListener('touchstart',e=>{ if(state&&e.touches.length===1) sy=e.touches[0].clientY; },{passive:true});
lb.addEventListener('touchmove',e=>{
  if(sy===null||!state) return;
  e.preventDefault();
  const d=e.touches[0].clientY-sy;
  if(d>0){ state.drag=d; lbimg.style.transition='none'; apply(d); lbbg.style.opacity=Math.max(0,.85-d/500); }
},{passive:false});
lb.addEventListener('touchend',()=>{
  if(sy===null||!state) return;
  const d=state.drag; sy=null; lbbg.style.opacity='';
  if(d>70) close();
  else{ lbimg.style.transition='transform .25s ease-out'; state.drag=0; apply(0); }
},{passive:true});
